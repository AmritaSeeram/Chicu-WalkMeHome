name: Deploy Walk Me Home landing

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build-landing.mjs'
      - 'default.json'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check landing JavaScript
        run: |
          node --check web/app.js
          node --check scripts/build-landing.mjs
      - name: Build static landing
        run: npm run build:web
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish landing
        id: deployment
        uses: actions/deploy-pages@v4
